name: Start a DataSquad at your institution
description: For institutions interested in adopting the DataSquad model. Tell us about your program and we'll be in touch.
title: "[Institution]: "
labels: ["interest", "institution"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your interest in bringing DataSquad to your institution! Fill this in and a network lead will follow up.

        Prefer to reach out privately, or don't have a GitHub account? See the email option on the template chooser instead.
  - type: input
    id: name
    attributes:
      label: Your name
    validations:
      required: true
  - type: input
    id: role
    attributes:
      label: Your role / title
      placeholder: e.g. Data Services Librarian, Department Chair
    validations:
      required: true
  - type: input
    id: institution
    attributes:
      label: Institution
    validations:
      required: true
  - type: input
    id: email
    attributes:
      label: Email
      description: How we'll reach you. This issue is public — leave blank if you'd rather we contact you another way.
    validations:
      required: false
  - type: dropdown
    id: region
    attributes:
      label: Country / region
      options:
        - United States
        - Europe
        - Other
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Where are you in the process?
      options:
        - Just exploring the idea
        - Actively planning a program
        - Already running something similar
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Tell us about your context
      description: Which library or department would run it? Who's involved? Any existing data-services work?
    validations:
      required: false
  - type: textarea
    id: motivation
    attributes:
      label: What draws you to the DataSquad model?
      description: What are you hoping it does for your students and researchers?
    validations:
      required: false
  - type: checkboxes
    id: needs
    attributes:
      label: What would be most useful from us?
      options:
        - label: A call to talk it through
        - label: Resources & templates to get started
        - label: To be connected with a similar institution
        - label: Just keeping us on your radar for now
  - type: checkboxes
    id: first_work
    attributes:
      label: What kinds of work might students do first?
      description: Pick any that fit. This helps us point you to examples and to a program doing similar work. The list is the network's shared vocabulary, see https://datasquad.info/projects.
      options:
        - label: Visualization and reporting
        - label: Data collection and scraping
        - label: Data cleaning and integration
        - label: Analysis and modeling
        - label: Tools and automation
        - label: Reproducibility and code migration
        - label: Data management and infrastructure
        - label: Digitization and heritage
        - label: Teaching and training
        - label: Not sure yet
  - type: checkboxes
    id: serves
    attributes:
      label: Who would the first projects be for?
      options:
        - label: Researchers (faculty, graduate students)
        - label: Courses and instructors
        - label: Campus offices (admissions, career center, IT, library)
        - label: The program itself
  - type: dropdown
    id: supervision
    attributes:
      label: Who would supervise students?
      description: Supervising students is the part most people worry about. An honest answer helps us help you.
      options:
        - A staff member with time set aside for it
        - A staff member, shared with other duties
        - Not decided yet
        - I'd like to talk about how others do it
    validations:
      required: false
  - type: dropdown
    id: pay
    attributes:
      label: How might students be paid or credited?
      options:
        - Hourly student jobs
        - Work-study
        - Academic credit or an internship
        - Grant or gift funded
        - Not decided yet
    validations:
      required: false
  - type: dropdown
    id: timeline
    attributes:
      label: When might you start?
      options:
        - Next term
        - Within a year
        - Just exploring for now
    validations:
      required: false
  - type: input
    id: heard
    attributes:
      label: How did you hear about DataSquad International?
    validations:
      required: false
  - type: textarea
    id: anything
    attributes:
      label: Anything else or questions?
    validations:
      required: false
  - type: checkboxes
    id: consent
    attributes:
      label: Listing
      options:
        - label: It's OK to mention our institution as interested in network updates
