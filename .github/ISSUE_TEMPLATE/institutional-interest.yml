name: Join the DataSquad network
description: Introduce yourself to the DataSquad network. A network lead will follow up in this issue.
title: "Join the DataSquad network"
labels: ["interest"]
body:
  - type: markdown
    attributes:
      value: |
        This is a short introduction, not an application. A network lead will follow up in this issue.

        Everything you enter here is public on GitHub. Submitting does not subscribe you to a mailing list or add your institution to a public directory.
  - type: input
    id: name
    attributes:
      label: Your name
    validations:
      required: true
  - type: input
    id: institution
    attributes:
      label: Institution or organization
    validations:
      required: true
  - type: input
    id: role
    attributes:
      label: Job title / role
      placeholder: e.g. Data Services Librarian, Department Chair
    validations:
      required: false
  - type: input
    id: email
    attributes:
      label: Email
      description: Optional. Anything entered here will be public. Leave this blank if you prefer to continue through GitHub.
    validations:
      required: false
  - type: input
    id: heard
    attributes:
      label: How did you hear about DataSquad International?
      placeholder: US-RSE poster, colleague, website, or another source
    validations:
      required: false
